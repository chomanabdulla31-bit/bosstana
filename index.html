<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iraq Coins - Geminicoin</title>
    <!-- SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --gold: #ffcc00;
            --bg: #000000;
            --card-bg: #111111;
            --blue-accent: #00d2ff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Screens */
        .screen { display: none; height: 100vh; padding: 20px; flex-direction: column; align-items: center; box-sizing: border-box; }
        .active-screen { display: flex; }

        /* Header */
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .miner-status { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 40px; height: 40px; background: #222; border-radius: 10px; display: flex; justify-content: center; align-items: center; }

        /* Balance */
        .balance-box { text-align: center; margin: 20px 0; }
        .balance-amount { font-size: 50px; font-weight: bold; color: var(--gold); display: flex; align-items: center; gap: 10px; }
        .mining-tag { color: #4CAF50; font-size: 12px; margin-top: 5px; }

        /* Main Tap Button (Mine Screen) */
        .tap-circle {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a1a1a 0%, #000 70%);
            border: 6px solid #222;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.1);
        }
        .tap-circle:active { transform: scale(0.95); }
        .main-icon { width: 180px; }

        /* Earn Screen (AdMob/Videos) */
        .video-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .watch-btn {
            background: var(--gold);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Energy Bar */
        .energy-container { width: 100%; margin-bottom: 100px; }
        .energy-bar { width: 100%; height: 12px; background: #222; border-radius: 10px; overflow: hidden; }
        .energy-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ffcc00, #ff9900); transition: width 0.3s; }

        /* Navigation */
        .nav-bar {
            position: fixed;
            bottom: 15px;
            width: 90%;
            left: 5%;
            height: 70px;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid #333;
            backdrop-filter: blur(10px);
        }
        .nav-item { text-align: center; color: #777; font-size: 11px; cursor: pointer; }
        .nav-item.active { color: var(--gold); }
        .nav-item i { font-size: 24px; display: block; margin-bottom: 3px; }

        /* Animations */
        @keyframes float { 0% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-100px); } }
        .plus-one { position: absolute; color: white; font-weight: bold; pointer-events: none; animation: float 0.7s forwards; }
    </style>
</head>
<body>

    <!-- SCREEN 1: MINE -->
    <div id="mine-screen" class="screen active-screen">
        <div class="header">
            <div class="miner-status">
                <div class="avatar">👤</div>
                <div>
                    <div style="font-size: 10px; color: #888;">STATUS: ACTIVE</div>
                    <div id="username">Loading...</div>
                </div>
            </div>
            <button style="background:none; border:1px solid #ffcc00; color:#ffcc00; border-radius:20px; padding:5px 15px; font-size:12px;">🧠 SEEK WISDOM</button>
        </div>

        <div class="balance-box">
            <div class="balance-amount">💎 <span id="balance">0</span></div>
            <div class="mining-tag">● MINING OPERATIONS ACTIVE</div>
        </div>

        <div class="tap-circle" id="tap-area">
            <!-- Icon optimized for SVG -->
            <svg class="main-icon" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#00d2ff" stroke-width="2" opacity="0.3"/>
                <path d="M50 20 L50 80 M20 50 L80 50" stroke="#00d2ff" stroke-width="2" />
                <circle cx="50" cy="50" r="30" fill="none" stroke="url(#grad)" stroke-width="4" />
                <text x="35" y="65" font-size="40" fill="#00d2ff" font-family="Arial">$</text>
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#9d50bb;" />
                        <stop offset="100%" style="stop-color:#00d2ff;" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="energy-container">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:14px;">
                <span>⚡ <span id="energy-val">1000</span>/1000</span>
                <span id="energy-percent" style="color:var(--gold)">100%</span>
            </div>
            <div class="energy-bar"><div class="energy-fill" id="energy-fill"></div></div>
        </div>
    </div>

    <!-- SCREEN 2: EARN (Video Section) -->
    <div id="earn-screen" class="screen">
        <h2 style="color:var(--gold)">Earn Rewards</h2>
        <p style="color:#888">Watch videos to get extra gems</p>
        
        <div class="video-card">
            <div>
                <strong>Watch Ad Video</strong><br>
                <small style="color:var(--gold)">+500 💎</small>
            </div>
            <button class="watch-btn" onclick="watchAd()">WATCH</button>
        </div>

        <div class="video-card">
            <div>
                <strong>Daily YouTube Task</strong><br>
                <small style="color:var(--gold)">+1000 💎</small>
            </div>
            <button class="watch-btn" onclick="window.open('https://youtube.com', '_blank')">OPEN</button>
        </div>

        <!-- AdMob Placeholder -->
        <div id="admob-container" style="margin-top:20px; width:100%; text-align:center;">
            <!-- لێرە کۆدی AdMob دابنێ کە بۆت دێت -->
            <p style="color:#444; font-size:10px;">ADVERTISEMENT SPACE</p>
        </div>
    </div>

    <!-- Nav Bar -->
    <nav class="nav-bar">
        <div class="nav-item active" onclick="showScreen('mine')"><i>📦</i>MINE</div>
        <div class="nav-item" onclick="showScreen('earn')"><i>▶️</i>EARN</div>
        <div class="nav-item"><i>👥</i>FRIENDS</div>
        <div class="nav-item"><i>⚡</i>BOOST</div>
    </nav>

    <script>
        // --- 1. CONFIGURATION ---
        const BOT_TOKEN = "8459462011:AAEd83QbjcVBbPGEYeaD0Q5-aIQs7rLQO2I";
        
        // ** گرنگ: زانیارییەکانی خۆت لێرە دابنێ **
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "your-app.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- 2. TELEGRAM SETUP ---
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe.user || { id: 12345, first_name: "Test User" };
        document.getElementById('username').innerText = user.first_name;

        // --- 3. STATE ---
        let balance = 0;
        let energy = 1000;
        const userId = user.id.toString();

        // Load Data
        async function loadUser() {
            const doc = await db.collection("users").doc(userId).get();
            if (doc.exists) {
                const data = doc.data();
                balance = data.balance || 0;
                energy = data.energy || 1000;
            } else {
                await db.collection("users").doc(userId).set({
                    name: user.first_name,
                    balance: 0,
                    energy: 1000,
                    lastSeen: Date.now()
                });
            }
            updateUI();
        }

        // UI Update
        function updateUI() {
            document.getElementById('balance').innerText = Math.floor(balance).toLocaleString();
            document.getElementById('energy-val').innerText = energy;
            const percent = (energy / 1000) * 100;
            document.getElementById('energy-fill').style.width = percent + "%";
            document.getElementById('energy-percent').innerText = Math.floor(percent) + "%";
        }

        // --- 4. CORE LOGIC ---
        const tapArea = document.getElementById('tap-area');
        tapArea.addEventListener('click', (e) => {
            if (energy > 0) {
                balance += 1;
                energy -= 1;
                updateUI();
                createFloatingText(e.clientX, e.clientY);
                tg.HapticFeedback.impactOccurred('light');
                syncToFirebase();
            }
        });

        function createFloatingText(x, y) {
            const el = document.createElement('div');
            el.className = 'plus-one';
            el.innerText = '+1';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 700);
        }

        // Sync (Debounced for performance)
        let syncTimeout;
        function syncToFirebase() {
            clearTimeout(syncTimeout);
            syncTimeout = setTimeout(() => {
                db.collection("users").doc(userId).update({
                    balance: balance,
                    energy: energy,
                    lastUpdate: Date.now()
                });
            }, 3000);
        }

        // Navigation
        function showScreen(name) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(name + '-screen').classList.add('active-screen');
            event.currentTarget.classList.add('active');
        }

        // Video Ads Logic
        function watchAd() {
            tg.showConfirm("ئایا دەتەوێت ڤیدیۆیەک ببینیت بۆ وەرگرتنی ٥٠٠ پارە؟", (ok) => {
                if(ok) {
                    tg.showProgress(true);
                    // لێرە دەتوانیت کۆدی AdMob Reward Video بانگ بکەیت
                    setTimeout(() => {
                        tg.showProgress(false);
                        balance += 500;
                        updateUI();
                        syncToFirebase();
                        tg.showAlert("پیرۆزە! ٥٠٠ گەمت وەرگرت.");
                    }, 3000); // وەک ئەوەی ٣ چرکە ڤیدیۆی بینیبێت
                }
            });
        }

        // Auto Energy Recovery
        setInterval(() => {
            if (energy < 1000) {
                energy += 1;
                updateUI();
            }
        }, 2000);

        loadUser();
    </script>
</body>
</html>
