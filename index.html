<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEMINICOIN - ELITE TITAN</title>
    
    <!-- SDKs -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --grey: #888888;
            --bg: #050505;
            --card: #0F0F0F;
            --border: rgba(255, 215, 0, 0.15);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body {
            margin: 0; background-color: var(--bg); color: white;
            font-family: 'Rajdhani', sans-serif; overflow: hidden; user-select: none;
        }

        /* --- LOADING SCREEN --- */
        #splash {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .s-diamond { width: 80px; filter: drop-shadow(0 0 20px var(--gold)); margin-bottom: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .s-loader { width: 40px; height: 40px; border: 3px solid #111; border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin-top: 30px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- HEADER --- */
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .h-user { display: flex; align-items: center; gap: 10px; background: #111; padding: 5px 12px; border-radius: 12px; border: 1px solid #222; }
        .h-user img { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--gold); }
        .seek-btn { background: rgba(255, 215, 0, 0.1); border: 1px solid var(--gold); padding: 8px 15px; border-radius: 20px; color: var(--gold); font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 0 10px var(--gold-glow); }

        /* --- NAVIGATION --- */
        nav { position: fixed; bottom: 15px; left: 15px; right: 15px; height: 75px; background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(10px); border-radius: 25px; border: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 5000; }
        .n-item { text-align: center; color: #555; font-size: 10px; font-weight: bold; cursor: pointer; flex: 1; transition: 0.3s; }
        .n-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .n-item.active { color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }

        /* --- PAGES --- */
        main { height: calc(100vh - 110px); overflow-y: auto; padding: 10px 20px 100px; scrollbar-width: none; }
        main::-webkit-scrollbar { display: none; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- MINE PAGE --- */
        .bal-hero { text-align: center; margin: 30px 0; }
        .bal-hero div { font-family: 'Orbitron'; font-size: 55px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--gold); }
        .bal-hero img { width: 40px; }
        .clicker-box { width: 280px; height: 280px; margin: 40px auto; border-radius: 50%; background: radial-gradient(circle, #222 0%, #000 70%); border: 10px solid #111; display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer; box-shadow: 0 0 40px rgba(0,0,0,1); }
        .clicker-box img { width: 160px; filter: drop-shadow(0 0 20px var(--gold-glow)); }
        .clicker-box:active { transform: scale(0.95); }

        /* --- RANK PAGE (AS PER IMAGE) --- */
        .rank-title { text-align: center; font-family: 'Orbitron'; font-size: 32px; margin-bottom: 5px; }
        .rank-sub { text-align: center; color: var(--grey); font-size: 14px; margin-bottom: 30px; }
        
        .podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin-bottom: 40px; }
        .pod-item { text-align: center; width: 100px; }
        .pod-av { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 3px solid #333; }
        .pod-av.first { width: 95px; height: 95px; border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow); }
        
        .pod-box { border-radius: 15px 15px 5px 5px; padding: 15px 0; font-family: 'Orbitron'; position: relative; display: flex; flex-direction: column; align-items: center; }
        .pod-box.first { height: 130px; background: var(--gold); color: black; }
        .pod-box.second { height: 100px; background: #222; color: white; }
        .pod-box.third { height: 80px; background: #3d2b1f; color: white; }
        
        .pod-num-circle { position: absolute; bottom: 15px; background: white; color: black; width: 26px; height: 26px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 900; }
        .pod-box.first .pod-num-circle { background: white; }
        .pod-box.second .pod-num-circle { background: #444; color: white; }
        .pod-box.third .pod-num-circle { background: #63452c; color: white; }

        .rank-list { display: flex; flex-direction: column; gap: 10px; }
        .rank-card { background: #0A0A0A; border-radius: 20px; padding: 15px; display: flex; align-items: center; gap: 15px; border: 1px solid #111; }
        .rank-card.me { border: 2px solid var(--gold); background: rgba(255, 215, 0, 0.05); }
        .rank-card .pos { width: 40px; font-weight: bold; color: var(--grey); font-size: 16px; }
        .rank-card .av { width: 45px; height: 45px; border-radius: 12px; object-fit: cover; }
        .rank-card .info { flex: 1; }
        .rank-card .info b { display: block; font-size: 16px; }
        .rank-card .info small { color: var(--grey); }
        .rank-card .val { text-align: right; color: var(--gold); font-weight: 900; font-family: 'Orbitron'; }
        .rank-card .val small { font-size: 10px; display: block; color: var(--grey); }

        .you-badge { background: var(--gold); color: black; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; margin-right: 5px; vertical-align: middle; }

        /* --- WITHDRAW & PROFILE --- */
        .withdraw-card { background: #0F0F0F; border: 1px solid var(--border); border-radius: 25px; padding: 25px; margin-top: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; color: var(--grey); margin-bottom: 5px; }
        .input-group input, .input-group select { width: 100%; background: #000; border: 1px solid #222; padding: 12px; border-radius: 12px; color: white; font-family: 'Rajdhani'; }
        .btn-gold { width: 100%; background: var(--gold); color: black; border: none; padding: 15px; border-radius: 15px; font-weight: 900; font-family: 'Orbitron'; cursor: pointer; }

        /* --- ENERGY --- */
        .e-bar-w { height: 10px; background: #111; border-radius: 10px; margin-top: 8px; border: 1px solid #222; overflow: hidden; }
        .e-bar-f { height: 100%; width: 100%; background: var(--gold); transition: 0.3s; box-shadow: 0 0 10px var(--gold); }
        
        .pop { position: absolute; color: var(--gold); font-weight: 900; font-size: 35px; pointer-events: none; animation: popUp 0.8s forwards; z-index: 1000; font-family: 'Orbitron'; }
        @keyframes popUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-130px); } }
    </style>
</head>
<body>

    <div id="splash">
        <img src="https://cdn-icons-png.flaticon.com/512/261/261882.png" class="s-diamond">
        <div style="font-family:'Orbitron'; font-size:24px; color:var(--gold);">GEMINICOIN</div>
        <div class="s-loader"></div>
    </div>

    <div id="app" style="display:none; height:100vh; flex-direction:column;">
        <header>
            <div class="h-user">
                <img id="h-av" src="https://i.pravatar.cc/150?u=titan">
                <div><span style="color:var(--grey); font-size:10px;">STATUS: ACTIVE</span><br><b id="h-name">Miner #402</b></div>
            </div>
            <div class="seek-btn" onclick="tg.showAlert('Daily Bonus: +5,000 GEM')">
                <i class="fas fa-brain"></i> SEEK WISDOM
            </div>
        </header>

        <main>
            <!-- MINE PAGE -->
            <div id="page-mine" class="page active">
                <div class="bal-hero">
                    <div id="bal-txt"><img src="https://cdn-icons-png.flaticon.com/512/261/261882.png"> 0</div>
                </div>

                <div class="clicker-box" id="tap-btn">
                    <img src="https://cdn-icons-png.flaticon.com/512/261/261882.png">
                </div>

                <div style="background:rgba(255,255,255,0.02); padding:20px; border-radius:25px; border:1px solid #111;">
                    <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--grey);">
                        <span>ENERGY SYNC</span>
                        <span id="en-perc">100%</span>
                    </div>
                    <div style="font-size:18px; margin-top:5px; font-weight:bold;">⚡ <span id="en-txt">1000 / 1000</span></div>
                    <div class="e-bar-w"><div class="e-bar-f" id="en-bar"></div></div>
                </div>
            </div>

            <!-- RANK PAGE -->
            <div id="page-rank" class="page">
                <h1 class="rank-title">Top Tappers</h1>
                <p class="rank-sub">Join the elite of GEM miners</p>
                
                <div class="podium" id="podium">
                    <!-- Dynamic Podium -->
                </div>

                <div class="rank-list" id="rank-list">
                    <!-- Dynamic List -->
                </div>
            </div>

            <!-- EARN PAGE -->
            <div id="page-earn" class="page">
                <h1 style="font-family:'Orbitron'; color:var(--gold);">REWARDS</h1>
                <div class="rank-card" onclick="watchAd(50000)">
                    <i class="fas fa-play" style="font-size:24px; color:var(--gold)"></i>
                    <div class="info"><b>Watch Video Ad</b><small>+50,000 GEM</small></div>
                    <button class="you-badge" style="border:none; cursor:pointer;">GO</button>
                </div>
            </div>

            <!-- BOOST PAGE -->
            <div id="page-boost" class="page">
                <h1 style="font-family:'Orbitron'; color:var(--gold);">UPGRADES</h1>
                <div id="boost-list"></div>
            </div>

            <!-- PROFILE & WITHDRAW PAGE -->
            <div id="page-profile" class="page">
                <div style="text-align:center;">
                    <img id="p-av" src="https://i.pravatar.cc/150?u=9" style="width:100px; height:100px; border-radius:20px; border:2px solid var(--gold); padding:5px;">
                    <h2 id="p-name" style="font-family:'Orbitron';">Miner</h2>
                </div>

                <div class="withdraw-card">
                    <h3 style="font-family:'Orbitron'; font-size:18px;"><i class="fas fa-money-bill-transfer"></i> WITHDRAW</h3>
                    <div class="input-group">
                        <label>PAYMENT METHOD</label>
                        <select id="wd-method">
                            <option value="zain">Zain Cash (Iraq)</option>
                            <option value="ton">TON Wallet</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>WALLET ADDRESS / NUMBER</label>
                        <input type="text" id="wd-address" placeholder="Address...">
                    </div>
                    <div class="input-group">
                        <label>AMOUNT (Min 1M)</label>
                        <input type="number" id="wd-amount" placeholder="1,000,000">
                    </div>
                    <button class="btn-gold" onclick="handleWithdraw()">CONFIRM</button>
                </div>
            </div>
        </main>

        <nav>
            <div class="n-item active" onclick="switchPage('mine', this)"><i class="fas fa-cube"></i>MINE</div>
            <div class="n-item" onclick="switchPage('earn', this)"><i class="fas fa-play"></i>EARN</div>
            <div class="n-item" onclick="switchPage('friends', this)"><i class="fas fa-user-group"></i>FRIENDS</div>
            <div class="n-item" onclick="switchPage('boost', this)"><i class="fas fa-bolt"></i>BOOST</div>
            <div class="n-item" onclick="switchPage('rank', this)"><i class="fas fa-trophy"></i>RANK</div>
        </nav>
    </div>

    <script>
        // --- FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBMN49BmTeQ4OaFbSuiC2AaELHdkOuc_8U",
            authDomain: "geminicoins-9f1a5.firebaseapp.com",
            projectId: "geminicoins-9f1a5",
            storageBucket: "geminicoins-9f1a5.firebasestorage.app",
            messagingSenderId: "841242980001",
            appId: "1:841242980001:web:b241ba1b7f281d691e4ae0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe.user || { id: "dev_123", first_name: "TapperUser" };
        const uid = String(user.id);

        let data = {
            bal: 0, en: 1000, max: 1000, tPow: 1, pass: 0, 
            lv: { tap: 0, core: 0 }, taps: 0, name: user.first_name, 
            av: `https://i.pravatar.cc/150?u=${user.id}`
        };

        const boosts = [
            { id: 'tap', name: 'Power Tap', cost: 500, add: 1, icon: 'fa-hand-pointer' },
            { id: 'core', name: 'Energy Core', cost: 1000, add: 500, icon: 'fa-battery-full' }
        ];

        async function init() {
            const doc = await db.collection("users").doc(uid).get();
            if(doc.exists) data = { ...data, ...doc.data() };
            else await db.collection("users").doc(uid).set(data);
            
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                renderBoosts();
                updateUI();
            }, 2000);

            setInterval(() => {
                if(data.en < data.max) data.en = Math.min(data.max, data.en + 2);
                updateUI();
            }, 100);

            setInterval(() => db.collection("users").doc(uid).set(data, {merge:true}), 10000);
        }

        function updateUI() {
            const b = Math.floor(data.bal);
            document.getElementById('bal-txt').innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/261/261882.png"> ${b.toLocaleString()}`;
            document.getElementById('en-txt').innerText = `${data.en} / ${data.max}`;
            document.getElementById('en-bar').style.width = (data.en/data.max*100) + "%";
            document.getElementById('en-perc').innerText = Math.floor(data.en/data.max*100) + "%";
            document.getElementById('h-name').innerText = data.name;
        }

        // --- TAP ---
        let lastTap = 0;
        document.getElementById('tap-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if(Date.now() - lastTap < 60) return;
            lastTap = Date.now();

            if(data.en >= data.tPow) {
                data.bal += data.tPow; data.en -= data.tPow;
                updateUI();
                tg.HapticFeedback.impactOccurred('medium');
                const t = e.touches[0];
                const p = document.createElement('div');
                p.className = 'pop'; p.innerText = `+${data.tPow}`;
                p.style.left = t.clientX + 'px'; p.style.top = t.clientY + 'px';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        });

        // --- RANK LOGIC (AS PER IMAGE) ---
        async function loadRank() {
            const listDiv = document.getElementById('rank-list');
            const podDiv = document.getElementById('podium');
            listDiv.innerHTML = "Syncing...";
            
            const snap = await db.collection("users").orderBy("bal", "desc").limit(20).get();
            let users = [];
            snap.forEach(d => users.push(d.data()));

            // Podium Rendering
            podDiv.innerHTML = "";
            // #2
            if(users[1]) podDiv.innerHTML += `
                <div class="pod-item">
                    <img src="${users[1].av}" class="pod-av">
                    <div class="pod-box second">#2<div class="pod-num-circle">2</div></div>
                </div>`;
            // #1
            if(users[0]) podDiv.innerHTML += `
                <div class="pod-item">
                    <img src="${users[0].av}" class="pod-av first">
                    <div class="pod-box first">#1<div class="pod-num-circle">1</div></div>
                </div>`;
            // #3
            if(users[2]) podDiv.innerHTML += `
                <div class="pod-item">
                    <img src="${users[2].av}" class="pod-av">
                    <div class="pod-box third">#3<div class="pod-num-circle">3</div></div>
                </div>`;

            // List Rendering
            listDiv.innerHTML = "";
            users.forEach((u, i) => {
                const isMe = u.name === data.name;
                listDiv.innerHTML += `
                    <div class="rank-card ${isMe ? 'me' : ''}">
                        <div class="pos">#${i + 1}</div>
                        <img src="${u.av}" class="av">
                        <div class="info">
                            <b>${isMe ? '<span class="you-badge">YOU</span>' : ''}${u.name}</b>
                            <small>Level ${1 + Math.floor(u.bal / 50000)}</small>
                        </div>
                        <div class="val">
                            ${(u.bal / 1000).toFixed(1)}k
                            <small>GEM</small>
                        </div>
                    </div>
                `;
            });
        }

        function switchPage(p, el) {
            document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
            document.querySelectorAll('.n-item').forEach(nb => nb.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active');
            if(el) el.classList.add('active');
            if(p === 'rank') loadRank();
            tg.HapticFeedback.selectionChanged();
        }

        function renderBoosts() {
            const list = document.getElementById('boost-list');
            list.innerHTML = "";
            boosts.forEach(b => {
                const lvl = data.lv[b.id] || 0;
                const cost = b.cost * (lvl + 1);
                list.innerHTML += `
                    <div class="rank-card" onclick="buyBoost('${b.id}')">
                        <i class="fas ${b.icon}" style="font-size:24px; color:var(--gold)"></i>
                        <div class="info"><b>${b.name} (LV ${lvl})</b><small>+${b.add} Power</small></div>
                        <div class="val">${(cost/1000).toFixed(1)}k</div>
                    </div>
                `;
            });
        }

        function buyBoost(id) {
            const b = boosts.find(x => x.id === id);
            const lvl = data.lv[id] || 0;
            const cost = b.cost * (lvl + 1);
            if(data.bal >= cost) {
                data.bal -= cost; data.lv[id] = lvl + 1;
                if(id === 'tap') data.tPow += b.add;
                else if(id === 'core') data.max += b.add;
                renderBoosts(); updateUI();
                tg.showAlert("Upgrade Successful!");
            } else tg.showAlert("Insufficient Gems!");
        }

        async function handleWithdraw() {
            const amount = parseInt(document.getElementById('wd-amount').value);
            if(amount < 1000000) return tg.showAlert("Min 1,000,000 Gems!");
            if(amount > data.bal) return tg.showAlert("Balance low!");
            data.bal -= amount; updateUI();
            tg.showAlert("Withdrawal Request Sent!");
        }

        function watchAd(r) {
            tg.showConfirm("Watch ad to sync gems?", (ok) => {
                if(ok) {
                    setTimeout(() => { data.bal += r; updateUI(); tg.showAlert("Success!"); }, 3000);
                }
            });
        }

        init();
    </script>
</body>
</html>
