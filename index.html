<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GEMINICOIN - ELITE TITAN</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --gold: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --grey: #888888;
            --bg: #050505;
            --card: #0F0F0F;
            --border: rgba(255, 215, 0, 0.15);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body {
            margin: 0; background-color: var(--bg); color: white;
            font-family: 'Rajdhani', sans-serif; overflow: hidden; user-select: none;
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed; inset: 0; background: #000; z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .s-diamond { width: 80px; filter: drop-shadow(0 0 20px var(--gold)); margin-bottom: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* --- HEADER --- */
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #111; }
        .h-user { display: flex; align-items: center; gap: 10px; background: #111; padding: 6px 15px; border-radius: 15px; border: 1px solid #222; }
        .h-user img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--gold); }
        .seek-btn { background: linear-gradient(90deg, #FFD700, #B8860B); color: black; padding: 8px 15px; border-radius: 20px; font-size: 12px; font-weight: 900; cursor: pointer; border: none; box-shadow: 0 0 10px var(--gold-glow); }

        /* --- NAVIGATION --- */
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); border-top: 1px solid #111; display: flex; justify-content: space-around; align-items: center; z-index: 5000; }
        .n-item { text-align: center; color: #555; font-size: 11px; cursor: pointer; flex: 1; transition: 0.3s; }
        .n-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .n-item.active { color: var(--gold); text-shadow: 0 0 10px var(--gold-glow); }

        /* --- PAGES --- */
        main { height: calc(100vh - 160px); overflow-y: auto; padding: 15px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- NEW TAP BUTTON (TITAN CORE) --- */
        .tap-container { display: flex; justify-content: center; align-items: center; margin: 40px 0; position: relative; }
        .tap-circle {
            width: 250px; height: 250px; border-radius: 50%;
            background: radial-gradient(circle, #1a1a1a 0%, #000 70%);
            border: 8px solid #111;
            position: relative; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 30px rgba(0,0,0,1), inset 0 0 20px rgba(255,215,0,0.05);
            cursor: pointer; transition: transform 0.1s;
        }
        .tap-circle::before {
            content: ''; position: absolute; inset: -12px; border-radius: 50%;
            border: 2px solid var(--gold); opacity: 0.2; animation: rotate 10s linear infinite;
        }
        .tap-circle::after {
            content: ''; position: absolute; inset: 10px; border-radius: 50%;
            border: 2px dashed var(--gold); opacity: 0.1; animation: rotate-rev 15s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotate-rev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        
        .tap-core {
            width: 140px; height: 140px; background: var(--gold);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 50px var(--gold-glow); color: black; font-size: 60px;
        }
        .tap-circle:active { transform: scale(0.92); }

        /* --- STATS & CARDS --- */
        .bal-hero { text-align: center; margin-bottom: 20px; }
        .bal-hero b { font-family: 'Orbitron'; font-size: 45px; color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .bal-hero img { width: 35px; }

        .earn-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 15px; display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .icon-box { width: 45px; height: 45px; background: #000; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: var(--gold); border: 1px solid #1a1a1a; }
        
        /* --- ENERGY BAR --- */
        .e-bar-w { height: 10px; background: #111; border-radius: 10px; margin-top: 10px; overflow: hidden; border: 1px solid #222; }
        .e-bar-f { height: 100%; width: 100%; background: linear-gradient(90deg, #B8860B, var(--gold)); box-shadow: 0 0 10px var(--gold); transition: 0.3s; }

        /* --- POPUP TEXT --- */
        .pop { position: absolute; color: var(--gold); font-weight: 900; font-size: 32px; font-family: 'Orbitron'; pointer-events: none; animation: popUp 0.8s forwards; z-index: 1000; }
        @keyframes popUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-150px); } }
    </style>
</head>
<body>

    <div id="splash">
        <img src="https://cdn-icons-png.flaticon.com/512/261/261882.png" class="s-diamond">
        <div style="font-family:'Orbitron'; font-size:24px; color:var(--gold); letter-spacing:4px;">TITAN PROTOCOL</div>
        <div style="color:#444; font-size:10px; margin-top:10px;">LOADING SECURE NODES...</div>
    </div>

    <div id="app" style="display:none; height:100vh; flex-direction:column;">
        <header>
            <div class="h-user">
                <img id="h-av" src="https://i.pravatar.cc/150?u=titan">
                <span id="h-name" style="font-weight:bold; font-size:14px;">Miner</span>
            </div>
            <button class="seek-btn" onclick="seekWisdom()">DAILY BONUS</button>
        </header>

        <main>
            <!-- MINE PAGE -->
            <div id="page-mine" class="page active">
                <div class="bal-hero">
                    <b id="bal-txt"><img src="https://cdn-icons-png.flaticon.com/512/261/261882.png"> 0</b>
                    <span style="color:var(--grey); font-size:12px; letter-spacing:2px;">• ELITE MINING STATUS •</span>
                </div>

                <div class="tap-container">
                    <div class="tap-circle" id="tap-btn">
                        <div class="tap-core">
                            <i class="fas fa-gem"></i>
                        </div>
                    </div>
                </div>

                <div class="energy-box" style="background:#0a0a0a; padding:15px; border-radius:20px; border:1px solid #111;">
                    <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:bold;">
                        <span>⚡ ENERGY REVEAL</span>
                        <span id="en-perc">100%</span>
                    </div>
                    <div class="e-bar-w"><div class="e-bar-f" id="en-bar"></div></div>
                    <div id="en-txt" style="text-align:center; margin-top:8px; font-size:14px; color:var(--grey);">1000 / 1000</div>
                </div>
            </div>

            <!-- OTHER PAGES (Simplified for stability) -->
            <div id="page-earn" class="page">
                <h2 style="font-family:'Orbitron'; color:var(--gold);">TASKS</h2>
                <div class="earn-card" onclick="watchAd(50000)">
                    <div class="icon-box"><i class="fas fa-play"></i></div>
                    <div style="flex:1"><b>Watch Premium Ad</b><br><small style="color:var(--grey)">+50,000 GEM</small></div>
                    <button style="background:var(--gold); border:none; border-radius:10px; padding:5px 10px; font-weight:bold;">GO</button>
                </div>
            </div>

            <div id="page-boost" class="page">
                <h2 style="font-family:'Orbitron'; color:var(--gold);">UPGRADES</h2>
                <div id="boost-list"></div>
            </div>
            
            <div id="page-wallet" class="page">
                <div style="background:linear-gradient(135deg, #111, #000); padding:30px; border-radius:25px; text-align:center; border:1px solid var(--border);">
                    <i class="fas fa-wallet" style="font-size:40px; color:var(--gold); margin-bottom:15px;"></i>
                    <div style="font-size:12px; color:var(--grey);">BALANCE</div>
                    <div id="wal-bal" style="font-size:45px; font-family:'Orbitron'; font-weight:900;">0</div>
                    <button onclick="withdraw()" style="width:100%; padding:15px; margin-top:20px; border-radius:15px; background:white; color:black; font-weight:900; border:none;">WITHDRAW</button>
                </div>
            </div>
        </main>

        <nav>
            <div class="n-item active" onclick="switchPage('mine', this)"><i class="fas fa-microchip"></i>MINE</div>
            <div class="n-item" onclick="switchPage('earn', this)"><i class="fas fa-tasks"></i>TASKS</div>
            <div class="n-item" onclick="switchPage('boost', this)"><i class="fas fa-rocket"></i>BOOST</div>
            <div class="n-item" onclick="switchPage('wallet', this)"><i class="fas fa-vault"></i>WALLET</div>
        </nav>
    </div>

    <script>
        // --- SECURE CONFIG & DATA ---
        const tg = window.Telegram.WebApp;
        tg.expand();

        let data = {
            bal: 0, en: 1000, max: 1000, tPow: 1, pass: 0,
            lastTap: 0, tapsInSecond: 0
        };

        // --- ANTI-HACK LOGIC ---
        function isSecureClick() {
            const now = Date.now();
            if (now - data.lastTap < 50) return false; // ڕێگری لە کلیکی زۆر خێرا (کەمتر لە 50ms)
            
            // ئەگەر لە یەک چرکەدا زیاتر لە 15 کلیک کرا، بە هاك هەژمار دەکرێت
            if (now - data.lastTap < 1000) {
                data.tapsInSecond++;
                if (data.tapsInSecond > 15) return false;
            } else {
                data.tapsInSecond = 0;
            }
            
            data.lastTap = now;
            return true;
        }

        function init() {
            // فەیک لۆدینگ
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                updateUI();
            }, 2500);

            // Passive Income
            setInterval(() => {
                if(data.en < data.max) {
                    data.en = Math.min(data.max, data.en + 3);
                    updateUI();
                }
            }, 1000);
        }

        function updateUI() {
            document.getElementById('bal-txt').innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/261/261882.png"> ${Math.floor(data.bal).toLocaleString()}`;
            document.getElementById('wal-bal').innerText = Math.floor(data.bal).toLocaleString();
            document.getElementById('en-txt').innerText = `${data.en} / ${data.max}`;
            document.getElementById('en-bar').style.width = (data.en/data.max*100) + "%";
            document.getElementById('en-perc').innerText = Math.floor(data.en/data.max*100) + "%";
        }

        // --- TAP EVENT ---
        document.getElementById('tap-btn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!isSecureClick()) return; // پاراستنەکە لێرە کار دەکات

            if(data.en >= data.tPow) {
                data.bal += data.tPow;
                data.en -= data.tPow;
                updateUI();
                tg.HapticFeedback.impactOccurred('light');

                const t = e.touches[0];
                showPop(t.clientX, t.clientY, `+${data.tPow}`);
            }
        });

        function showPop(x, y, txt) {
            const p = document.createElement('div');
            p.className = 'pop'; p.innerText = txt;
            p.style.left = x + 'px'; p.style.top = y + 'px';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }

        function switchPage(p, el) {
            document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
            document.querySelectorAll('.n-item').forEach(nb => nb.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active');
            el.classList.add('active');
            tg.HapticFeedback.selectionChanged();
        }

        function withdraw() {
            if(data.bal < 100000) tg.showAlert("Minimum 100,000 GEM required!");
            else tg.showConfirm("Do you want to sync with your wallet?");
        }

        function seekWisdom() {
            data.bal += 1000;
            updateUI();
            tg.showAlert("Daily Bonus: +1,000 GEM Synced!");
        }

        init();
    </script>
</body>
</html>
